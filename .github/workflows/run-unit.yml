name: Run Unit Tests

on:
  workflow_call:
    inputs:
      image:
        description: "oras:// reference of the SIF pushed by the build"
        required: true
        type: string
      macro_file:
        description: "Path to macro file inside the repo"
        required: false
        default: "macro/unit.mac"
        type: string

jobs:
  test-container:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apptainer on the runner
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Pull Container from GHCR
        id: pull
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          echo "Pulling from: $IMAGE"
          apptainer pull simulation.sif "$IMAGE"
          echo "geant4_version=$(sudo apptainer exec --unsquash simulation.sif geant4-config --version)" >> "$GITHUB_OUTPUT"

      # Datasets depend on the Geant4 version of the image.
      - name: Restore Geant4 data from cache
        id: g4data-cache
        uses: actions/cache@v4
        with:
          path: /tmp/g4data
          key: geant4-data-${{ steps.pull.outputs.geant4_version }}

      - name: Download Geant4 data libraries (if cache miss)
        if: steps.g4data-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/g4data
          sudo apptainer exec --unsquash -B /tmp/g4data:/g4data \
            simulation.sif \
            bash -c "geant4-config --install-datasets"

      - name: Run Geant4 Simulation
        run: |
          echo "Running macro: ${{ inputs.macro_file }}"
          sudo apptainer run \
            --unsquash \
            -B /tmp/g4data:/g4data:ro \
            simulation.sif \
            "${GITHUB_WORKSPACE}/${{ inputs.macro_file }}"
