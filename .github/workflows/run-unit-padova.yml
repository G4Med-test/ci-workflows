name: Run Unit Tests Offloading Padova

on:
  workflow_call:
    inputs:
      image:
        description: "oras:// reference of the SIF pushed by the build"
        required: true
        type: string
      macro_file:
        description: "Path to macro file inside the repo"
        required: false
        default: "macro/unit.mac"
        type: string
      tools_ref:
        description: "ci-workflows ref providing scripts/run-unit.sh: keep it equal to the `uses:` ref"
        required: false
        default: main
        type: string

jobs:
  # Padova runs only reviewed code: the default branch, never a pull request or
  # another branch, and only if the rules of that branch accept nothing but approved
  # pull requests (scripts/check_protection.py). The checks are here, not in
  # pipeline.yml, so that calling this workflow directly cannot skip them.
  check-protection:
    if: ${{ !startsWith(github.event_name, 'pull_request') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: G4Med-test/ci-workflows
          ref: ${{ inputs.tools_ref }}
          path: ci-tools
      - name: Check that the default branch is protected
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ci-tools/scripts/check_protection.py --branch "$BRANCH" "$GITHUB_REPOSITORY"

  test-container-padova:
    needs: check-protection
    if: ${{ !startsWith(github.event_name, 'pull_request') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: geant-gha-runner-on-padova
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: G4Med-test/ci-workflows
          ref: ${{ inputs.tools_ref }}
          path: ci-tools

      # The runner is shared: every job gets its own image, cache and output directory.
      - name: Create isolated working directories
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/geant-unit.XXXXXXXX")
          mkdir -p "$work/cache" "$work/tmp"
          {
            echo "UNIT_WORK=$work"
            echo "APPTAINER_CACHEDIR=$work/cache"
            echo "APPTAINER_TMPDIR=$work/tmp"
          } >> "$GITHUB_ENV"

      - name: Pull Container from GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
        run: |
          echo "$GITHUB_TOKEN" | apptainer registry login -u "$GITHUB_ACTOR" --password-stdin oras://ghcr.io
          echo "Pulling from: $IMAGE"
          apptainer pull "$UNIT_WORK/simulation.sif" "$IMAGE"

      # The same script runs the unit macro outside GitHub Actions.
      - name: Run container with macro
        env:
          MACRO_FILE: ${{ inputs.macro_file }}
        run: |
          ci-tools/scripts/run-unit.sh --sif "$UNIT_WORK/simulation.sif" \
            --macro "$GITHUB_WORKSPACE/$MACRO_FILE" --work "$UNIT_WORK" \
            --g4data /cvmfs/geant4.cern.ch/share/data

      - name: Clean this job's temporary files
        if: ${{ always() && env.UNIT_WORK != '' }}
        run: rm -rf -- "$UNIT_WORK"
