name: Run Unit Tests Offloading Padova

on:
  workflow_call:
    inputs:
      image:
        description: "oras:// reference of the SIF pushed by the build"
        required: true
        type: string
      macro_file:
        description: "Path to macro file inside the repo"
        required: false
        default: "macro/unit.mac"
        type: string

jobs:
  test-container-padova:
    runs-on: geant-gha-runner-on-padova
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner is shared: every job gets its own image, cache and output directory.
      - name: Create isolated working directories
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/geant-unit.XXXXXXXX")
          mkdir -p "$work/cache" "$work/tmp" "$work/outputs"
          echo "UNIT_WORK=$work" >> "$GITHUB_ENV"
          echo "APPTAINER_CACHEDIR=$work/cache" >> "$GITHUB_ENV"
          echo "APPTAINER_TMPDIR=$work/tmp" >> "$GITHUB_ENV"

      - name: Pull Container from GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
        run: |
          echo "$GITHUB_TOKEN" | apptainer registry login -u "$GITHUB_ACTOR" --password-stdin oras://ghcr.io
          echo "Pulling from: $IMAGE"
          apptainer pull "$UNIT_WORK/simulation.sif" "$IMAGE"

      - name: Run container with macro
        run: |
          echo "Running macro: ${{ inputs.macro_file }}"
          cd "$UNIT_WORK/outputs"
          apptainer run --unsquash \
            -B /cvmfs/geant4.cern.ch/share/data:/g4data:ro \
            -B "$UNIT_WORK/outputs:/outputs" \
            "$UNIT_WORK/simulation.sif" \
            "${GITHUB_WORKSPACE}/${{ inputs.macro_file }}"

      - name: Clean this job's temporary files
        if: ${{ always() && env.UNIT_WORK != '' }}
        run: rm -rf -- "$UNIT_WORK"
