name: Apptainer Build and Deploy

on:
  workflow_call:
    inputs:
      apptainer_def:
        description: "Path to the Apptainer.def file"
        required: true
        type: string
      geant4_tag:
        description: "Tag of ghcr.io/g4med-test/geant4-alma9; empty uses the TAG default of Apptainer.def"
        required: false
        default: ""
        type: string
    outputs:
      image:
        description: "oras:// reference of the pushed multi-arch SIF, used by the test jobs"
        value: ${{ jobs.index.outputs.image }}

jobs:
  # Each architecture is built and tested on a native runner (no emulation) and
  # pushed as :<tag>-<arch>; the index job below publishes :<tag> for both.
  build-test-container:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            host_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            host_arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Apptainer on the runner
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | apptainer registry login \
            --authfile "$RUNNER_TEMP/apptainer-auth.json" \
            -u "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Build Container
        env:
          GEANT4_TAG: ${{ inputs.geant4_tag }}
        run: |
          args=()
          if [[ -n "$GEANT4_TAG" ]]; then
            [[ "$GEANT4_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] \
              || { echo "Invalid geant4_tag: $GEANT4_TAG" >&2; exit 1; }
            args+=(--build-arg "TAG=$GEANT4_TAG")
          fi
          sudo apptainer build --authfile "$RUNNER_TEMP/apptainer-auth.json" "${args[@]}" \
            --build-arg PROJECT_NAME="${{ github.event.repository.name }}" \
            simulation.sif \
            "${{ inputs.apptainer_def }}"

      - name: Check the built image matches the runner architecture
        run: |
          built="$(sudo apptainer exec --unsquash simulation.sif uname -m)"
          test "$built" = "${{ matrix.host_arch }}"

      # <commit SHA>, or <commit SHA>-<geant4 tag> when a Geant4 version is requested,
      # so builds of the same commit with different Geant4 versions do not collide.
      - name: Push Container to GHCR
        id: push
        env:
          GEANT4_TAG: ${{ inputs.geant4_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="oras://ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}${GEANT4_TAG:+-$GEANT4_TAG}-${ARCH}"
          echo "Pushing to: $image"
          apptainer push --authfile "$RUNNER_TEMP/apptainer-auth.json" simulation.sif "$image"

      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/apptainer-auth.json"

  # The multi-arch tag is the completion marker checked by downstream jobs: it is
  # only published once both architectures above have built, tested and pushed.
  index:
    name: Publish multi-arch index
    needs: build-test-container
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    outputs:
      image: ${{ steps.index.outputs.image }}
    steps:
      - uses: oras-project/setup-oras@v1

      - name: Publish the multi-arch index
        id: index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEANT4_TAG: ${{ inputs.geant4_tag }}
        run: |
          tag="${GITHUB_SHA}${GEANT4_TAG:+-$GEANT4_TAG}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras manifest index create "$repo:$tag" "$repo:$tag-amd64" "$repo:$tag-arm64"
          echo "image=oras://$repo:$tag" >> "$GITHUB_OUTPUT"
